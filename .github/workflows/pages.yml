# The game in the browser on GitHub Pages (E-47). Runs on GitHub after a push to main, or by hand.
# Never run so far: the first run shows whether the versions below still fit.
name: Web build on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  QT_VERSION: 6.12.0
  # Qt 6.12 is built with exactly this Emscripten, see doc.qt.io/qt-6/wasm.html.
  EMSDK_VERSION: 5.0.5
  # No qtmultimedia: Qt 6.12 has none for WebAssembly, the browser build is silent (E-47).
  QT_MODULES: qtquick3d qtshadertools qtquicktimeline

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt for the build machine and for WebAssembly
        run: |
          pip install aqtinstall==3.3.0 ninja
          # Never run so far: the log shows the names aqt offers, should the two below be wrong.
          aqt list-qt linux desktop --arch "$QT_VERSION"
          aqt list-qt all_os wasm --arch "$QT_VERSION"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -m $QT_MODULES -O "$RUNNER_TEMP/Qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -m $QT_MODULES -O "$RUNNER_TEMP/Qt"

      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build
        env:
          QTD_QT_DIR: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          QTD_QT_WASM_DIR: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/wasm_singlethread
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cmake --preset wasm
          cmake --build --preset wasm --target QtowerDefense

      # Qt writes the page beside the program, index.html opens it at the address of the site.
      - name: Page
        run: |
          ls -l build/wasm/bin
          mkdir site
          cp build/wasm/bin/QtowerDefense.html site/index.html
          cp build/wasm/bin/QtowerDefense.js build/wasm/bin/QtowerDefense.wasm build/wasm/bin/qtloader.js site/
          cp build/wasm/bin/qtlogo.svg site/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
